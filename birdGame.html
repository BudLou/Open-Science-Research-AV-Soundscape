<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bird Guessing Game</title>

    <link rel="stylesheet" href="testGame.css">
    <script src="gamelogic.js" defer></script>
</head>

<body>

    <main>

        <!-- Top navigation bar -->
        <header class="top-bar">

            <p id="progress">0 / 6</p>

            <div class="difficulty-section">
                <label for="difficulty">Difficulty:</label>

                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>

            <button id="back" type="button">
                 ← Back
            </button>

            <button id="restart" type="button">
                &#8635; Restart
            </button>

            <p class="score-display">
                Score - <span id="score">0</span>
            </p>

        </header>

        <!-- Main game area -->
        <section id="game" class="game-container">

            <!-- Left side: Bird picture -->
            <div class="bird-section">

                <p id="specimen" hidden></p>

                <img
                    id="birdImage"
                    src=""
                    alt="Bird to identify"
                >

                <button id="listen" type="button" disabled>
                    &#9654; Play Bird Call
                </button>

            </div>

            <!-- Right side: Question and answers -->
            <div class="answer-section">

                <h1>Identify this Bird</h1>

                <div id="answers" class="answers-container">
                    <!-- JavaScript creates answer buttons here -->
                </div>

                <p id="feedback" class="feedback"></p>

                <button id="next" type="button" disabled>
                    Next Bird
                </button>

            </div>

        </section>

        <!-- Game completion screen -->
        <section id="end" style="display: none;">

            <h1>Game Complete!</h1>

            <p id="summary"></p>

            <button id="playAgain" type="button">
                Play Again
            </button>

        </section>

        <!-- Hidden score information -->
        <div hidden>
            <span id="correct">0</span>
            <span id="incorrect">0</span>
            <span id="best">0</span>
        </div>

    </main>

</body>
</html>
