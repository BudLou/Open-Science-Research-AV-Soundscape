<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AV Soundscape</title>

    <link rel="stylesheet" href="./index.css">
</head>

<body>

    <!-- Sign-in link in the top-right corner -->
    <a href="./loginPage.html" class="sign-in">
        <span class="sign-in-icon">◎</span>
        <span>Sign in</span>
    </a>

    <!-- Homepage heading -->
    <header>
        <h1>AV Soundscape</h1>
        <p>Discover Birds and their calls here!</p>
    </header>

    <!-- Main content -->
    <main>

        <!-- Blue jay image -->
        <img
            src="./images/blue-jay.jpg"
            alt="Blue jay perched on a branch"
            class="bird-image"
        >

        <!-- Bird search bar -->
        <form class="search-form" action="#" method="get">

            <span class="search-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="10.5" cy="10.5" r="6.5"></circle>
                    <path d="M15.5 15.5L21 21"></path>
                </svg>
            </span>

            <input
                type="text"
                name="bird"
                placeholder="Search"
                aria-label="Search for a bird species"
            >

            <button
                type="button"
                class="mic-button"
                aria-label="Voice search"
                title="Voice search"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="2" width="6" height="13" rx="3"></rect>
                    <path d="M5 11a7 7 0 0 0 14 0"></path>
                    <path d="M12 18v4M9 22h6"></path>
                </svg>
            </button>

        </form>

        <!-- Homepage navigation buttons -->
        <div class="button-container">

            <button
                type="button"
                onclick="window.location.href='./loginPage.html'"
            >
                Enter
            </button>

            <button
                type="button"
                onclick="window.location.href='./loginPage.html'"
            >
                Field Challenge
            </button>

        </div>

    </main>

</body>

</html>
